# Formelab — one Worker serves the home page, web app, admin panel, APIs, MCP server, SDK and app files.
# To run your own copy: replace formelab.ai with your domain and set your own database_id.
name = "formelab"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# global_fetch_strictly_public: required by the OAuth provider to fetch MCP clients'
# Client ID Metadata Documents safely (subrequests always go to the public internet).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

routes = [
  { pattern = "formelab.ai/*", zone_name = "formelab.ai" },
  { pattern = "*.formelab.ai/*", zone_name = "formelab.ai" },
  { pattern = "formelab.app/*", zone_name = "formelab.app" },
  { pattern = "*.formelab.app/*", zone_name = "formelab.app" },
]

[build]
command = "node scripts/gen-assets.mjs"

[limits]
cpu_ms = 30000

[vars]
# Home page, sign-in, waitlist, MCP connector; the admin panel on admin.DOMAIN.
DOMAIN = "formelab.ai"
# Published apps, one host each: <host_label>.APP_DOMAIN. The web app is app.DOMAIN.
APP_DOMAIN = "formelab.app"
ENVIRONMENT = "production"
# Sender for notification emails, on a domain onboarded to Cloudflare Email Service (README 1.8).
EMAIL_FROM = "Formelab <hello@formelab.ai>"

[[d1_databases]]
binding = "DB"
database_name = "launchpad"
database_id = "ba4a0464-c702-4582-982c-aab12c498515"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "launchpad-sites"

# OAuth grants and tokens for the AI connectors (formelab-oauth-kv). Pinned, so a deploy from any
# machine binds the store that holds everyone's AI connections rather than making a new one.
[[kv_namespaces]]
binding = "OAUTH_KV"
id = "6aa3d1cde40d4ddd9bd434036af5289b"

# 60 secret-proxy calls per minute per site.
[[ratelimits]]
name = "PROXY_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# 10 waitlist sign-ups per minute per client IP.
[[ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# 20 sign-in attempts (password, code, reset) per minute per client IP.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

# 5 responses per minute from each public-link guest (per app and client IP); see src/responses.ts.
[[ratelimits]]
name = "RESPONSES_LIMITER"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

# 20 Gemini or Google Sheets calls per minute from each person using someone else's app (keyed by
# owner and person, so moving between the owner's apps doesn't reset it); see src/gemini.ts.
[[ratelimits]]
name = "VIEWER_LIMITER"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

# Notification emails through Cloudflare Email Service (Workers Paid). Only this sender may be used.
[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@formelab.ai"]

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Staging: `npx wrangler deploy --env staging` (docs/staging.md). Its own Worker (formelab-staging),
# domains, database, bucket, OAuth store and rate-limit counters, so nothing is shared with
# production. ENVIRONMENT is "staging", never "dev": the DEV_USER sign-in bypass stays off.
# Bindings must be repeated per env.
# ---------------------------------------------------------------------------
[env.staging]
workers_dev = false
routes = [
  { pattern = "formelab-staging.com/*", zone_name = "formelab-staging.com" },
  { pattern = "*.formelab-staging.com/*", zone_name = "formelab-staging.com" },
  { pattern = "formelab-staging.app/*", zone_name = "formelab-staging.app" },
  { pattern = "*.formelab-staging.app/*", zone_name = "formelab-staging.app" },
]

[env.staging.vars]
DOMAIN = "formelab-staging.com"
APP_DOMAIN = "formelab-staging.app"
ENVIRONMENT = "staging"
EMAIL_FROM = "Formelab staging <hello@formelab-staging.com>"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "launchpad-staging"
database_id = "37531b25-23eb-49da-b93f-e3d50dea9dd7"
migrations_dir = "migrations"

[[env.staging.r2_buckets]]
binding = "BUCKET"
bucket_name = "launchpad-staging-sites"

[[env.staging.kv_namespaces]]
binding = "OAUTH_KV"
id = "a15510d65c4e4ab2bc39ac479719c517"

[[env.staging.ratelimits]]
name = "PROXY_LIMITER"
namespace_id = "2001"
simple = { limit = 60, period = 60 }

[[env.staging.ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[env.staging.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "2003"
simple = { limit = 20, period = 60 }

[[env.staging.ratelimits]]
name = "RESPONSES_LIMITER"
namespace_id = "2004"
simple = { limit = 5, period = 60 }

[[env.staging.ratelimits]]
name = "VIEWER_LIMITER"
namespace_id = "2005"
simple = { limit = 20, period = 60 }

[[env.staging.send_email]]
name = "EMAIL"
allowed_sender_addresses = ["hello@formelab-staging.com"]

[env.staging.observability]
enabled = true

# ---------------------------------------------------------------------------
# Local development: `npm run dev` (wrangler dev --env dev).
# No routes here, so wrangler keeps the real Host header and hosts like
# http://app.localhost:8787 (web app) and http://hoops-7kq2.apps.localhost:8787 (an app) work.
# Bindings must be repeated per env.
# ---------------------------------------------------------------------------
[env.dev]
routes = []

[env.dev.vars]
DOMAIN = "localhost"
APP_DOMAIN = "apps.localhost"
ENVIRONMENT = "dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "launchpad"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "launchpad-sites"

[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"

[[env.dev.ratelimits]]
name = "PROXY_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[[env.dev.ratelimits]]
name = "WAITLIST_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[env.dev.ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[env.dev.ratelimits]]
name = "RESPONSES_LIMITER"
namespace_id = "1004"
simple = { limit = 5, period = 60 }

[[env.dev.ratelimits]]
name = "VIEWER_LIMITER"
namespace_id = "1005"
simple = { limit = 20, period = 60 }

# In local dev, emails are logged by wrangler instead of being sent.
[[env.dev.send_email]]
name = "EMAIL"
