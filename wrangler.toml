# Formelab — one Worker serves the dashboard, APIs, MCP server, SDK and app files.
# To run your own copy: replace formelab.ai with your domain and set your own database_id.
name = "formelab"
main = "src/index.ts"
compatibility_date = "2026-08-01"
# global_fetch_strictly_public: required by the OAuth provider to fetch MCP clients'
# Client ID Metadata Documents safely (subrequests always go to the public internet).
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]
workers_dev = false

routes = [
  { pattern = "formelab.ai/*", zone_name = "formelab.ai" },
  { pattern = "*.formelab.ai/*", zone_name = "formelab.ai" },
]

[build]
command = "node scripts/gen-assets.mjs"

[limits]
cpu_ms = 30000

[vars]
DOMAIN = "formelab.ai"
ENVIRONMENT = "production"

[[d1_databases]]
binding = "DB"
database_name = "launchpad"
database_id = "ba4a0464-c702-4582-982c-aab12c498515"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "launchpad-sites"

# OAuth grants and tokens for the Claude chat connector. No id: `wrangler deploy`
# creates the namespace on first deploy and remembers it.
[[kv_namespaces]]
binding = "OAUTH_KV"

# 60 secret-proxy calls per minute per site.
[[ratelimits]]
name = "PROXY_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[observability]
enabled = true

# ---------------------------------------------------------------------------
# Local development: `npm run dev` (wrangler dev --env dev).
# No routes here, so wrangler keeps the real Host header and namespace hosts
# like http://test.localhost:8787 work. Bindings must be repeated per env.
# ---------------------------------------------------------------------------
[env.dev]
routes = []

[env.dev.vars]
DOMAIN = "localhost"
ENVIRONMENT = "dev"

[[env.dev.d1_databases]]
binding = "DB"
database_name = "launchpad"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "launchpad-sites"

[[env.dev.kv_namespaces]]
binding = "OAUTH_KV"

[[env.dev.ratelimits]]
name = "PROXY_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
